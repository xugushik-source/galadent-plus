<!DOCTYPE html><html lang="ru"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BuchoDenti STAFF</title><style>:root{--teal:#176B68;--gold:#C9974A;--bg:#F2FAF9;--muted:#6E8177;--danger:#C0483A}*{box-sizing:border-box}body{margin:0;background:var(--bg);font:14px Arial,sans-serif;color:#183333}.wrap{max-width:900px;margin:auto;padding:20px}.head{display:flex;justify-content:space-between;align-items:center}.brand{font-size:24px;font-weight:800;color:var(--teal)}.brand small{display:block;font-size:11px;color:var(--gold);letter-spacing:.1em}.tabs{display:flex;gap:7px;overflow:auto;margin:20px 0}.tab{padding:10px 14px;border-radius:10px;background:#fff;color:var(--muted);font-weight:700;white-space:nowrap;cursor:pointer}.tab.active{background:var(--teal);color:#fff}.panel{display:none}.panel.active{display:block}.card{background:#fff;border-radius:14px;padding:16px;margin-bottom:12px;box-shadow:0 2px 8px #17333312}.row{display:grid;grid-template-columns:110px 1fr;gap:8px;margin:5px 0}.time{font-size:22px;color:var(--teal);font-weight:800}input,textarea,button{width:100%;padding:11px;border:1px solid #dce5da;border-radius:9px;margin:5px 0;font:inherit}button{background:var(--teal);color:#fff;border:0;font-weight:800;cursor:pointer}.gold{background:var(--gold)}.danger{background:var(--danger)}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.muted{color:var(--muted)}.empty{padding:20px;text-align:center;color:var(--muted)}@media(max-width:600px){.grid,.row{grid-template-columns:1fr}.wrap{padding:14px}}</style></head><body><div class="wrap"><div class="head"><div class="brand">BuchoDenti<small>STAFF BOOKING SYSTEM</small></div><a href="index.html">Сайт</a></div><div class="tabs"><div class="tab active" data-tab="today">Сегодня</div><div class="tab" data-tab="all">Все записи</div><div class="tab" data-tab="new">Новая запись</div><div class="tab" data-tab="search">Поиск клиента</div></div><div id="today" class="panel active"></div><div id="all" class="panel"></div><div id="new" class="panel"><div class="card"><h3>Новая запись</h3><div class="grid"><input id="nDate" type="date"><input id="nTime" placeholder="Время, например 10:30"></div><div class="grid"><input id="nName" placeholder="Имя"><input id="nLast" placeholder="Фамилия"></div><input id="nPhone" placeholder="Телефон"><input id="nProc" placeholder="Процедура"><textarea id="nNote" placeholder="Заметка"></textarea><input id="nPrice" placeholder="Цена"><button id="nBook" class="gold">Создать запись</button><div id="nMsg" class="muted"></div></div></div><div id="search" class="panel"><div class="card"><h3>Поиск клиента</h3><input id="sPhone" placeholder="Телефон"><button id="sBtn">Найти</button></div><div id="sResult"></div></div></div><script>const WEB_APP_URL='ВСТАВЬ_СЮДА_BUCHODENTI_WEB_APP_URL';const todayStr=new Date().toISOString().slice(0,10);nDate.value=todayStr;function api(action,payload={}){if(WEB_APP_URL.includes('ВСТАВЬ_СЮДА'))return Promise.resolve({ok:false,error:'BuchoDenti Apps Script пока не подключён'});return fetch(WEB_APP_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(Object.assign({action},payload))}).then(r=>r.json()).catch(()=>({ok:false,error:'Ошибка соединения'}))}document.querySelectorAll('.tab').forEach(t=>t.onclick=()=>{document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));document.querySelectorAll('.panel').forEach(x=>x.classList.remove('active'));t.classList.add('active');document.getElementById(t.dataset.tab).classList.add('active');if(t.dataset.tab==='today')loadDay(todayStr,today);if(t.dataset.tab==='all')loadAll()});function card(v){return '<div class="card"><div class="time">'+v.time+'</div><b>'+((v.name||'')+' '+(v.lastName||''))+'</b><div class="muted">'+(v.phone||'')+'</div><div>'+(v.procedure||'')+'</div><div class="muted">'+(v.note||'')+'</div><div class="grid"><input id="proc-'+v.id+'" value="'+(v.procedure||'')+'"><input id="price-'+v.id+'" value="'+(v.price||'')+'"></div><textarea id="note-'+v.id+'">'+(v.note||'')+'</textarea><button onclick="save(\''+v.id+'\')">Сохранить</button><div class="grid"><input type="date" id="rd-'+v.id+'"><input id="rt-'+v.id+'" placeholder="Новое время"></div><button class="gold" onclick="move(\''+v.id+'\')">Перенести</button><button class="danger" onclick="cancelV(\''+v.id+'\')">Отменить запись</button></div>'}function loadDay(date,el){el.innerHTML='<div class="empty">Загрузка…</div>';api('listVisits',{date}).then(r=>{el.innerHTML=r.ok?(r.data.length?r.data.map(card).join(''):'<div class="empty">Записей нет</div>'):'<div class="empty">'+r.error+'</div>'})}function loadAll(){let box=all;box.innerHTML='<div class="card"><label>Дата</label><input id="allDate" type="date" value="'+todayStr+'"><button id="allLoad">Показать</button></div><div id="allRows"></div>';allLoad.onclick=()=>loadDay(allDate.value,allRows);loadDay(todayStr,allRows)}function save(id){api('updateVisit',{id,procedure:document.getElementById('proc-'+id).value,note:document.getElementById('note-'+id).value,price:document.getElementById('price-'+id).value}).then(()=>loadDay(todayStr,today))}function move(id){let date=document.getElementById('rd-'+id).value,time=document.getElementById('rt-'+id).value;if(!date||!time)return;api('reschedule',{id,date,time}).then(r=>{alert(r.ok?'Перенесено':r.error);loadDay(todayStr,today)})}function cancelV(id){if(!confirm('Отменить запись?'))return;api('cancel',{id}).then(r=>{alert(r.ok?'Отменено':r.error);loadDay(todayStr,today)})}nBook.onclick=()=>api('bookManual',{date:nDate.value,time:nTime.value,name:nName.value,lastName:nLast.value,phone:nPhone.value,procedure:nProc.value,note:nNote.value,price:nPrice.value}).then(r=>nMsg.textContent=r.ok?'Запись создана':r.error);sBtn.onclick=()=>api('searchPatient',{phone:sPhone.value}).then(r=>{if(!r.ok){sResult.innerHTML='<div class="empty">'+r.error+'</div>';return}if(!r.data.found){sResult.innerHTML='<div class="empty">Клиент не найден</div>';return}sResult.innerHTML='<div class="card"><b>'+r.data.name+' '+r.data.lastName+'</b></div>'+r.data.visits.map(card).join('')});loadDay(todayStr,today);</script></body></html>
